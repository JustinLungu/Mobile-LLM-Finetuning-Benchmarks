# Model registry: the single source of truth for every model in this repo.
#
# Download scripts, benchmarks, fine-tuning and both phone apps read from this
# file, so a model is always referred to by its key (e.g. `qwen3.5-2b`) and
# everyone gets exactly the same files.
#
# Every value below was checked against Hugging Face on 2026-11-01.

models:
  qwen3.5-2b:
    display_name: Qwen 3.5 2B

    # Original weights, published by the model's authors. Used for fine-tuning.
    original:
      repo: Qwen/Qwen3.5-2B
      # A revision is a git commit hash of the Hugging Face repo. Pinning it
      # means we always get these exact files, even if the authors update the
      # repo later.
      revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
      # Total parameters, including a ~0.3B vision encoder that Wilo does not
      # use (Qwen 3.5 models accept images as well as text).
      params: 2274069824
      license: apache-2.0
      # Gated repos require accepting a license on Hugging Face before download.
      gated: false

    # 4-bit GGUF version, the format llama.cpp runs on computers and phones.
    # Qwen does not publish GGUF files for Qwen 3.5, so we use Unsloth's
    # conversion, the most-downloaded one.
    gguf:
      repo: unsloth/Qwen3.5-2B-GGUF
      revision: f6d5376be1edb4d416d56da11e5397a961aca8ae
      file: Qwen3.5-2B-Q4_K_M.gguf
      # Q4_K_M: about 4–5 bits per weight. "K" is llama.cpp's block-wise
      # quantization scheme; "M" (medium) keeps the most sensitive layers at
      # higher precision. The usual default for quality vs. size on phones.
      quant: Q4_K_M
      size_bytes: 1280835840  # ~1.28 GB
      # SHA256 of the file, published by Hugging Face. The download script
      # checks it so we know the file is complete and unmodified.
      sha256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223

    context_length: 262144
    # Qwen 3.5 can "think" (write hidden reasoning before answering). The chat
    # template switches it with `enable_thinking`; it adds latency on phones.
    supports_thinking: true
    notes: >-
      Hybrid architecture: 3 of every 4 layers use linear attention, so memory
      for long prompts grows much more slowly than in a standard transformer.
      Requires a recent llama.cpp build that supports the qwen3_5 architecture.
