# Model registry: the single source of truth for every model in this repo.
#
# Download scripts, benchmarks, fine-tuning and both phone apps read from this
# file, so a model is always referred to by its key (e.g. `qwen3.5-2b`) and
# everyone gets exactly the same files.
#
# Every value below was checked against Hugging Face on 2026-11-01.

models:
  qwen3.5-2b:
    display_name: Qwen 3.5 2B

    # Original weights, published by the model's authors. Used for fine-tuning.
    original:
      repo: Qwen/Qwen3.5-2B
      # A revision is a git commit hash of the Hugging Face repo. Pinning it
      # means we always get these exact files, even if the authors update the
      # repo later.
      revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
      # Total parameters, including a ~0.3B vision encoder that Wilo does not
      # use (Qwen 3.5 models accept images as well as text).
      params: 2274069824
      license: apache-2.0
      # Gated repos require accepting a license on Hugging Face before download.
      gated: false

    # 4-bit GGUF version, the format llama.cpp runs on computers and phones.
    # Qwen does not publish GGUF files for Qwen 3.5, so we use Unsloth's
    # conversion, the most-downloaded one.
    gguf:
      repo: unsloth/Qwen3.5-2B-GGUF
      revision: f6d5376be1edb4d416d56da11e5397a961aca8ae
      file: Qwen3.5-2B-Q4_K_M.gguf
      # Q4_K_M: about 4–5 bits per weight. "K" is llama.cpp's block-wise
      # quantization scheme; "M" (medium) keeps the most sensitive layers at
      # higher precision. The usual default for quality vs. size on phones.
      quant: Q4_K_M
      size_bytes: 1280835840  # ~1.28 GB
      # SHA256 of the file, published by Hugging Face. The download script
      # checks it so we know the file is complete and unmodified.
      sha256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223

    context_length: 262144
    # Qwen 3.5 can "think" (write hidden reasoning before answering). The chat
    # template switches it with `enable_thinking`; it adds latency on phones.
    supports_thinking: true
    notes: >-
      Hybrid architecture: 3 of every 4 layers use linear attention, so memory
      for long prompts grows much more slowly than in a standard transformer.
      Requires a recent llama.cpp build that supports the qwen3_5 architecture.

  llama3.2-3b:
    display_name: Llama 3.2 3B Instruct

    original:
      repo: meta-llama/Llama-3.2-3B-Instruct
      revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
      params: 3212749824  # text only, no vision encoder
      # Llama 3.2 Community License: free for research and most commercial
      # use, with an acceptable-use policy.
      license: llama3.2
      # Meta approves access requests manually. Request access on the model
      # page well before you need the original weights (fine-tuning, M5).
      gated: true

    gguf:
      # Same quantizer as the other models, so differences come from the
      # models, not from how they were converted. Not gated.
      repo: unsloth/Llama-3.2-3B-Instruct-GGUF
      revision: e7d0997e49c9cb00d88b4c1a6a16aa894b0bbc31
      file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
      quant: Q4_K_M
      size_bytes: 2019377600  # ~2.02 GB
      sha256: 6c99cc00ae910f6a532a80022cb4bc1939094527a089c29294b841c0bd87f74d

    context_length: 131072
    supports_thinking: false
    notes: >-
      Standard transformer (every layer uses full attention), released in 2024.
      The oldest and best-supported model in the set: every llama.cpp version
      and phone app can run it.

  gemma4-e2b:
    display_name: Gemma 4 E2B Instruct

    original:
      repo: google/gemma-4-E2B-it
      revision: 3e22461f65e89153144f8adb70e3b8c2cc9845a7
      # "E2B" means 2.3B *effective* parameters. The full count is 5.1B,
      # because each layer has its own large embedding table (Per-Layer
      # Embeddings). Those tables are only used for lookups, so most of them
      # can stay in storage instead of RAM. Also includes ~150M vision and
      # ~300M audio encoder parameters that Wilo does not use.
      params: 5123178051
      license: apache-2.0
      gated: false

    gguf:
      repo: unsloth/gemma-4-E2B-it-GGUF
      revision: 0314792d7f1f7e229411f620751375812bb9faf2
      file: gemma-4-E2B-it-Q4_K_M.gguf
      quant: Q4_K_M
      # Larger than the 3B Llama file because of the embedding tables. Whether
      # it fits a 4 GB phone depends on how much of it is actually loaded into
      # RAM. That is one of the main things to measure.
      size_bytes: 3106738272  # ~3.11 GB
      sha256: 740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8

    context_length: 131072
    supports_thinking: true
    notes: >-
      Alternatives if Q4_K_M does not fit: Google's own quantization-aware
      trained 4-bit file (google/gemma-4-E2B-it-qat-q4_0-gguf, ~3.35 GB) or
      Unsloth's mobile 2-bit version (unsloth/gemma-4-E2B-it-qat-mobile-GGUF,
      ~2.19 GB). Uses a 512-token sliding window in most layers.

  qwen3.5-4b:
    display_name: Qwen 3.5 4B

    original:
      repo: Qwen/Qwen3.5-4B
      revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
      params: 4659865088  # includes the vision encoder
      license: apache-2.0
      gated: false

    gguf:
      repo: unsloth/Qwen3.5-4B-GGUF
      revision: e87f176479d0855a907a41277aca2f8ee7a09523
      file: Qwen3.5-4B-Q4_K_M.gguf
      quant: Q4_K_M
      size_bytes: 2740937888  # ~2.74 GB
      sha256: 00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4

    context_length: 262144
    supports_thinking: true
    notes: >-
      Same architecture as qwen3.5-2b (hybrid linear attention), so comparing
      the two isolates the effect of model size. Expected to need a 6 GB+
      phone.
